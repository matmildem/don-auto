<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DA Montagem</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Choices.js -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/choices.js/public/assets/styles/choices.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/choices.js/public/assets/scripts/choices.min.js"></script>

  <link rel="stylesheet" href="./style.css">
  
</head>

<body>

  <div class="container py-4">
    <button class="btn btn-outline mb-3" onclick="window.location.href='../pagina principal/index.html'">
      ← Voltar
    </button>

    <div class="card shadow p-3">
      <div class="row align-items-center">

        <!-- Imagem -->
        <div class="col-md-5 text-center">
          <img id="carro-imagem" class="img-fluid rounded" alt="Carro selecionado">
        </div>

        <!-- Infos e opções -->
        <div class="col-md-7">
          <h3 id="carro-nome" class="fw-bold mb-4"></h3>

          <!-- Cor -->
          <div class="mb-3">
            <label for="selectCor" class="form-label fw-semibold">Escolha a Cor:</label>
            <select id="selectCor" class="form-select">
              <option value="Preto">Preto</option>
              <option value="Branco">Branco</option>
              <option value="Vermelho">Vermelho</option>
              <option value="Azul">Azul</option>
              <option value="Verde">Verde</option>
              <option value="Cinza">Cinza</option>
            </select>
          </div>

          <!-- Suspensão -->
          <div class="mb-3">
            <label for="selectSuspensao" class="form-label fw-semibold">Tipo de Suspensão:</label>
            <select id="selectSuspensao" class="form-select">
              <option value="Original">Original</option>
              <option value="Rebaixada">Rebaixada</option>
              <option value="Ajustável">Ajustável</option>
              <option value="OffRoad">OffRoad</option>
            </select>
          </div>

          <!-- Roda -->
          <div class="mb-3">
            <label for="selectRoda" class="form-label fw-semibold">Roda:</label>
            <select id="selectRoda" class="form-select">
              <option value="Original">Original</option>
              <option value="Volk_Racing">Volk_Racing</option>
              <option value="Enkei">Enkei</option>
              <option value="BBS">BBS</option>
              <option value="Forgiato">Forgiato</option>
              <option value="Rotiform">Rotiform</option>
            </select>
          </div>

          <!-- BodyKit -->
          <div class="mb-3">
            <label for="selectBodykit" class="form-label fw-semibold">BodyKit:</label>
            <select id="selectBodykit" class="form-select">
              <option value="Original">Original</option>
              <option value="Veilside">Veilside</option>
              <option value="Rocket_Bunny">Rocket Bunny</option>
              <option value="Liberty_Walk">Liberty Walk</option>
              <option value="Mansory">Mansory</option>
              <option value="Varis">Varis</option>
            </select>
          </div>

          <!-- Desempenho -->
          <div class="mb-3">
            <label for="selectDesempenho" class="form-label fw-semibold">Modificações de Desempenho:</label>
            <select id="selectDesempenho" multiple>
              <option value="remap">remap</option>
              <option value="filtro">filtro</option>
              <option value="escapamento">escapamento</option>
              <option value="turbo">turbo</option>
              <option value="intercooler">intercooler</option>
              <option value="freios">freios</option>
            </select>
          </div>

          <!-- Conforto -->
          <div class="mb-3">
            <label for="selectConforto" class="form-label fw-semibold">Modificações Internas e de Conforto:</label>
            <select id="selectConforto" multiple>
              <option value="Bancos">Bancos</option>
              <option value="Volante">Volante</option>
              <option value="som">som</option>
              <option value="Iluminação">Iluminação</option>
              <option value="Isolamento">Isolamento</option>
            </select>
          </div>

          <!-- Tecnológicas -->
          <div class="mb-3">
            <label for="selectTecnologia" class="form-label fw-semibold">Modificações Tecnológicas / Eletrônicas:</label>
            <select id="selectTecnologia" multiple>
              <option value="multimidia">multimidia</option>
              <option value="Câmera">Câmera</option>
              <option value="ignição">ignição</option>
              <option value="tração">tração</option>
              <option value="farois">farois</option>
            </select>
          </div>

          <!-- Outras -->
          <div class="mb-3">
            <label for="selectOutras" class="form-label fw-semibold">Outras Modificações:</label>
            <select id="selectOutras" multiple>
              <option value="LED">LED</option>
              <option value="carbono">carbono</option>
              <option value="Aerofólio">Aerofólio</option>
              <option value="insulfilm">insulfilm</option>
            </select>
          </div>
        <div class="mb-3">
          <h4 class="fw-bold">Preço: <span id="precoTotal">R$ 0,00</span></h4>
        </div>

          <button id="btnSalvar" class="btn btn-primary w-100">Ir para o carrinho</button>
        </div>
      </div>
    </div>
  </div>

  <script>
 window.onload = function () {

  const carro = JSON.parse(localStorage.getItem("carroSelecionado"));
  if (!carro) {
    alert("Nenhum carro selecionado. Voltando à página anterior...");
    window.location.href = "../produtos/index.html";
    return;
  }

  const nomeElemento = document.getElementById("carro-nome");
  const imagemElemento = document.getElementById("carro-imagem");
  const selectCor = document.getElementById("selectCor");
  const btnSalvar = document.getElementById("btnSalvar");
  const precoElemento = document.getElementById("precoTotal"); // <- precisa existir no HTML

  nomeElemento.innerText = carro.descricao;
  imagemElemento.src = carro.imagem;

  // tabela de preços - chaves livres; iremos buscar com função que normaliza o valor selecionado
  const precos = {
    // cor (todas zero por enquanto)
    cor: {
      preto: 0, branco: 0, vermelho: 0, azul: 0, verde: 0, cinza: 0
    },
    suspensao: {
      original: 0,
      rebaixada: 1200,
      ajustavel: 3500,
      offroad: 5000
    },
    roda: {
      original: 0,
      volk_racing: 6990,
      enkei: 20290,
      bbs: 5990,
      forgiato: 12990,
      rotiform: 18590
    },
    bodykit: {
      original: 0,
      veilside: 38500,
      rocket_bunny: 13490,
      liberty_walk: 59490,
      mansory: 130490,
      varis: 58490
    },
    desempenho: {
      turbo: 4000,
      remap: 1500,
      filtro: 200,
      intercooler: 3790,
      freios: 20000,
      escapamento: 1650
    },
    conforto: {
      bancos: 4000,
      som: 1600,
      iluminacao: 200,
      volante: 300,
      isolamento: 300
    },
    tecnologia: {
      multimidia: 500,
      camera: 100,
      tracao: 200,
      farois: 600,
      igincao: 500  // fallback; we'll also check other normalized forms
    },
    outras: {
      led: 400,
      carbono: 500,
      insulfilm: 800,
      aerofolio: 500
    }
  };

  // normalize text: remove diacritics, lowercase, replace spaces and non-alnum with underscores
  function normalizeKey(str) {
    if (!str && str !== 0) return "";
    return String(str)
      .normalize('NFD').replace(/[\u0300-\u036f]/g, '') // remove accents
      .toLowerCase()
      .replace(/[^a-z0-9]+/g, '_')
      .replace(/^_+|_+$/g, '');
  }

  function getPrice(categoria, valorSelecionado) {
    const key = normalizeKey(valorSelecionado);
    // try direct match first
    if (precos[categoria] && typeof precos[categoria][key] !== "undefined") {
      return Number(precos[categoria][key]);
    }

    // fallbacks for some specific known mismatches
    if (categoria === 'tecnologia') {
      // camera vs câmera etc
      if (key === 'camera') return Number(precos.tecnologia.camera || 0);
      if (key === 'camara') return Number(precos.tecnologia.camera || 0);
      if (key === 'ignicao' || key === 'ignição' || key === 'igincao') return Number(precos.tecnologia.igincao || 0);
      if (key === 'farois' || key === 'faróis') return Number(precos.tecnologia.farois || precos.tecnologia.farois || precos.tecnologia.farois || 0);
    }

    // if nothing found, try raw value as key (defensive)
    if (precos[categoria] && typeof precos[categoria][valorSelecionado] !== "undefined") {
      return Number(precos[categoria][valorSelecionado]);
    }

    return 0;
  }

  // Função para calcular preço total (inclui PREÇO BASE DO CARRO)
  function calcularPreco() {
    let total = 0;

    // Começa com o preço base do carro
    if (carro.preco) total += Number(carro.preco);

    // Cor
    const corSel = selectCor.value;
    total += getPrice('cor', corSel);

    // Suspensão
    const susp = document.getElementById("selectSuspensao").value;
    total += getPrice('suspensao', susp);

    // Rodas
    const roda = document.getElementById("selectRoda").value;
    total += getPrice('roda', roda);

    // Bodykit
    const body = document.getElementById("selectBodykit").value;
    total += getPrice('bodykit', body);

    // Múltiplos
    function somaMultiplos(id, categoria) {
      const select = document.getElementById(id);
      Array.from(select.selectedOptions).forEach(opt => {
        total += getPrice(categoria, opt.value);
      });
    }

    somaMultiplos("selectDesempenho", "desempenho");
    somaMultiplos("selectConforto", "conforto");
    somaMultiplos("selectTecnologia", "tecnologia");
    somaMultiplos("selectOutras", "outras");

    precoElemento.innerText = "R$ " + total.toLocaleString("pt-BR");

    return total;
  }

  // Atualizar imagem ao trocar cor
  selectCor.addEventListener("change", function () {
    const corSelecionada = selectCor.value.toLowerCase();

    const corNormalizada = corSelecionada
      .replace("preta", "preto")
      .replace("branca", "branco")
      .replace("vermelha", "vermelho");

    const nomeArquivo = `${carro.descricao.toLowerCase()}-${corNormalizada}.jpg`;
    imagemElemento.src = `./images/${nomeArquivo}`;

    calcularPreco();
  });

  // Choices.js
  const selectsMultiplos = [
    "selectDesempenho",
    "selectConforto",
    "selectTecnologia",
    "selectOutras"
  ];

  selectsMultiplos.forEach(id => {
    new Choices(`#${id}`, {
      removeItemButton: true,
      placeholderValue: "Selecione uma ou mais opções",
      searchEnabled: false
    });
  });

  function getSelectedValues(selectId) {
    return Array.from(document.getElementById(selectId).selectedOptions)
      .map(opt => opt.value);
  }

  // Atualizar preço sempre que algo mudar
  document.querySelectorAll("select").forEach(select => {
    select.addEventListener("change", calcularPreco);
  });

  // Salvar configuração final
  btnSalvar.onclick = function () {
    const configuracao = {
      descricao: carro.descricao,
      imagem: imagemElemento.src,
      cor: selectCor.value,
      suspensao: document.getElementById("selectSuspensao").value,
      roda: document.getElementById("selectRoda").value,
      bodykit: document.getElementById("selectBodykit").value,
      desempenho: getSelectedValues("selectDesempenho"),
      conforto: getSelectedValues("selectConforto"),
      tecnologia: getSelectedValues("selectTecnologia"),
      outras: getSelectedValues("selectOutras"),
      precoTotal: calcularPreco() // salva o valor final (INCLUI PREÇO BASE)
    };

    let configuracoes =
      JSON.parse(localStorage.getItem("configuracoesCarros")) || [];

    configuracoes.push(configuracao);

    localStorage.setItem("configuracoesCarros", JSON.stringify(configuracoes));

    window.location.href = "../carrinho/index.html";
  };

  calcularPreco(); // calcula preço inicial
};

    
  
  </script>

</body>
</html>
